<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #1c1917; --muted: #78716c; --accent: #b45309; --surface-2: #ede8df; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 680px; height: 220px; display: block; }
  .box { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.5; rx: 10; transition: stroke 0.25s, stroke-width 0.25s; }
  .box.active { stroke: var(--accent); stroke-width: 2.5; }
  .lbl { fill: var(--muted); font-size: 11px; font-weight: 600; text-anchor: middle; }
  .bits { fill: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 700; text-anchor: middle; }
  .sum { fill: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; font-weight: 700; text-anchor: middle; }
  .wire { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; opacity: 0.45; }
  .wire.done { stroke: var(--accent); stroke-dasharray: none; opacity: 1; }
  .carry-lbl { fill: var(--accent); font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; opacity: 0; transition: opacity 0.2s; }
  .carry-lbl.show { opacity: 1; }
</style>
</head>
<body>
<svg viewBox="0 0 680 220" aria-label="Simulación de retardo de acarreo sumando 1111 + 0001">
  <!-- Cables de acarreo de derecha a izquierda -->
  <line id="w0" class="wire" x1="520" y1="95" x2="470" y2="95" />
  <line id="w1" class="wire" x1="370" y1="95" x2="320" y2="95" />
  <line id="w2" class="wire" x1="220" y1="95" x2="170" y2="95" />
  <line id="w3" class="wire" x1="70" y1="95" x2="35" y2="95" />

  <text id="c1" class="carry-lbl" x="495" y="86">C1=1</text>
  <text id="c2" class="carry-lbl" x="345" y="86">C2=1</text>
  <text id="c3" class="carry-lbl" x="195" y="86">C3=1</text>
  <text id="c4" class="carry-lbl" x="48" y="86">Cout=1</text>

  <!-- Columna 3 (MSB) -->
  <rect id="b3" class="box" x="70" y="40" width="100" height="110" />
  <text class="lbl" x="120" y="60">Columna 3</text>
  <text class="bits" x="120" y="88">1 + 0</text>
  <text id="s3" class="sum" x="120" y="135">?</text>

  <!-- Columna 2 -->
  <rect id="b2" class="box" x="220" y="40" width="100" height="110" />
  <text class="lbl" x="270" y="60">Columna 2</text>
  <text class="bits" x="270" y="88">1 + 0</text>
  <text id="s2" class="sum" x="270" y="135">?</text>

  <!-- Columna 1 -->
  <rect id="b1" class="box" x="370" y="40" width="100" height="110" />
  <text class="lbl" x="420" y="60">Columna 1</text>
  <text class="bits" x="420" y="88">1 + 0</text>
  <text id="s1" class="sum" x="420" y="135">?</text>

  <!-- Columna 0 (LSB) -->
  <rect id="b0" class="box" x="520" y="40" width="100" height="110" />
  <text class="lbl" x="570" y="60">Columna 0</text>
  <text class="bits" x="570" y="88">1 + 1</text>
  <text id="s0" class="sum" x="570" y="135">?</text>

  <!-- Resultado final -->
  <text id="res" class="lbl" x="340" y="192">1111 + 0001 → esperando propagación secuencial del carry...</text>
</svg>
<script>
  function syncTheme() {
    try {
      const p = parent && parent.document && parent.document.documentElement;
      if (!p) return;
      const cs = getComputedStyle(p);
      ['--text', '--muted', '--accent', '--surface-2'].forEach((v) => {
        const val = cs.getPropertyValue(v).trim();
        if (val) document.documentElement.style.setProperty(v, val);
      });
    } catch (_) {}
  }
  syncTheme();
  try {
    if (parent && parent.document && parent.document.documentElement) {
      new MutationObserver(syncTheme).observe(parent.document.documentElement, {
        attributes: true, attributeFilter: ['data-theme', 'class', 'style']
      });
    }
  } catch (_) {}

  const $ = (id) => document.getElementById(id);
  let step = -1;

  function tick() {
    step = (step + 1) % 6;
    if (step === 0) {
      [0, 1, 2, 3].forEach((i) => {
        $('b' + i).classList.remove('active');
        $('w' + i).classList.remove('done');
        $('s' + i).textContent = '?';
      });
      ['c1', 'c2', 'c3', 'c4'].forEach((id) => $(id).classList.remove('show'));
      $('res').textContent = '1111 + 0001 → esperando propagación secuencial del carry...';
    } else if (step <= 4) {
      const i = step - 1;
      [0, 1, 2, 3].forEach((k) => $('b' + k).classList.toggle('active', k === i));
      $('s' + i).textContent = 'S=0';
      $('w' + i).classList.add('done');
      $('c' + step).classList.add('show');
      $('res').textContent = 'Etapa ' + step + '/4: Columna ' + i + ' calcula 0 y propaga carry = 1';
    } else {
      [0, 1, 2, 3].forEach((k) => $('b' + k).classList.remove('active'));
      $('res').textContent = 'Resultado final tras 4 etapas en serie: 1 0000';
    }
  }
  tick();
  setInterval(tick, 1300);
</script>
</body>
</html>
