<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Demostración interactiva</title>
  <style>
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Demostración HTML embebida</h2>
  <p>Este es un iframe de ejemplo cargado perezosamente.</p>
