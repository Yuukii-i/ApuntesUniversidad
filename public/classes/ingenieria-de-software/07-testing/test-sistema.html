<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #1c1917; --muted: #78716c; --accent: #b45309; --surface-2: #ede8df; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 680px; height: 165px; display: block; }
  .block { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.5; rx: 10; transition: stroke 0.2s, stroke-width 0.2s; }
  .block.active { stroke: var(--accent); stroke-width: 2.5; }
  .person { fill: var(--text); }
  .cable { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; opacity: 0.45; }
  .pulse { fill: var(--accent); opacity: 0; }
  .db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.5; transition: stroke 0.2s, stroke-width 0.2s; }
  .db.active { stroke: var(--accent); stroke-width: 2.5; }
  .tick-circle { fill: #16a34a; opacity: 0; transition: opacity 0.25s; }
  .tick-circle.show { opacity: 1; }
  .tick-mark { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.25s; }
  .tick-mark.show { opacity: 1; }
</style>
</head>
<body>
<svg viewBox="0 0 680 165" aria-label="Animación de test de sistema desde usuario pasando por bloques hasta la base de datos y de regreso">
  <!-- Cables entre nodos -->
  <line class="cable" x1="85" y1="82" x2="555" y2="82" />

  <!-- Persona (Usuario) -->
  <circle class="person" cx="55" cy="58" r="14" />
  <path class="person" d="M 31 110 C 31 86, 79 86, 79 110 Z" />
  <circle id="tc" class="tick-circle" cx="82" cy="42" r="12" />
  <path id="tm" class="tick-mark" d="M 76 42 L 80 46 L 88 37" />

  <!-- Bloques sin nombre (clases) -->
  <rect id="n0" class="block" x="145" y="52" width="75" height="60" />
  <rect id="n1" class="block" x="275" y="52" width="75" height="60" />
  <rect id="n2" class="block" x="405" y="52" width="75" height="60" />

  <!-- Base de datos (cilindro) -->
  <path id="db-body" class="db" d="M 555 52 L 555 108 A 38 12 0 0 0 631 108 L 631 52 Z" />
  <ellipse id="db-top" class="db" cx="593" cy="52" rx="38" ry="12" />

  <!-- Señal viajera -->
  <circle id="sig" class="pulse" cx="85" cy="82" r="7" />
</svg>
<script>
  function syncTheme() {
    try {
      const p = parent && parent.document && parent.document.documentElement;
      if (!p) return;
      const cs = getComputedStyle(p);
      ['--text', '--muted', '--accent', '--surface-2'].forEach((v) => {
        const val = cs.getPropertyValue(v).trim();
        if (val) document.documentElement.style.setProperty(v, val);
      });
    } catch (_) {}
  }
  syncTheme();
  try {
    if (parent && parent.document && parent.document.documentElement) {
      new MutationObserver(syncTheme).observe(parent.document.documentElement, {
        attributes: true, attributeFilter: ['data-theme', 'class', 'style']
      });
    }
  } catch (_) {}

  const $ = (id) => document.getElementById(id);
  const sig = $('sig');

  function runCycle() {
    $('tc').classList.remove('show');
    $('tm').classList.remove('show');
    sig.style.opacity = '1';
    const start = performance.now();
    const dur = 2600;

    function frame(now) {
      const p = Math.min(1, (now - start) / dur);
      const x = p <= 0.5 ? 85 + (p * 2) * 470 : 555 - ((p - 0.5) * 2) * 470;
      sig.setAttribute('cx', String(x));

      $('n0').classList.toggle('active', x >= 140 && x <= 225);
      $('n1').classList.toggle('active', x >= 270 && x <= 355);
      $('n2').classList.toggle('active', x >= 400 && x <= 485);
      const dbHit = x > 520;
      $('db-body').classList.toggle('active', dbHit);
      $('db-top').classList.toggle('active', dbHit);

      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        sig.style.opacity = '0';
        $('tc').classList.add('show');
        $('tm').classList.add('show');
      }
    }
    requestAnimationFrame(frame);
  }
  runCycle();
  setInterval(runCycle, 3400);
</script>
</body>
</html>
