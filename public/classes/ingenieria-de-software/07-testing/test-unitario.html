<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #1c1917; --muted: #78716c; --accent: #b45309; --surface-2: #ede8df; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 520px; height: 150px; display: block; }
  .block { fill: var(--surface-2); rx: 12; }
  .line { fill: var(--muted); opacity: 0.3; rx: 4; transition: fill 0.25s, opacity 0.25s; }
  .line.run { fill: var(--accent); opacity: 0.95; }
  .tick-circle { fill: #16a34a; opacity: 0; transform-origin: 380px 75px; transform: scale(0.6); transition: opacity 0.3s, transform 0.3s; }
  .tick-circle.show { opacity: 1; transform: scale(1); }
  .tick-mark { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.3s; }
  .tick-mark.show { opacity: 1; }
</style>
</head>
<body>
<svg viewBox="0 0 520 150" aria-label="Animación de test unitario ejecutando un bloque de código">
  <rect class="block" x="90" y="20" width="210" height="110" />
  <rect id="l0" class="line" x="112" y="40" width="95" height="10" />
  <rect id="l1" class="line" x="128" y="60" width="145" height="10" />
  <rect id="l2" class="line" x="128" y="80" width="120" height="10" />
  <rect id="l3" class="line" x="112" y="100" width="65" height="10" />

  <circle id="tc" class="tick-circle" cx="380" cy="75" r="26" />
  <path id="tm" class="tick-mark" d="M 368 75 L 377 84 L 394 66" />
</svg>
<script>
  function syncTheme() {
    try {
      const p = parent && parent.document && parent.document.documentElement;
      if (!p) return;
      const cs = getComputedStyle(p);
      ['--text', '--muted', '--accent', '--surface-2'].forEach((v) => {
        const val = cs.getPropertyValue(v).trim();
        if (val) document.documentElement.style.setProperty(v, val);
      });
    } catch (_) {}
  }
  syncTheme();
  try {
    if (parent && parent.document && parent.document.documentElement) {
      new MutationObserver(syncTheme).observe(parent.document.documentElement, {
        attributes: true, attributeFilter: ['data-theme', 'class', 'style']
      });
    }
  } catch (_) {}

  const $ = (id) => document.getElementById(id);
  let step = -1;
  function loop() {
    step = (step + 1) % 6;
    if (step === 0) {
      [0, 1, 2, 3].forEach((i) => $('l' + i).classList.remove('run'));
      $('tc').classList.remove('show');
      $('tm').classList.remove('show');
    } else if (step <= 4) {
      $('l' + (step - 1)).classList.add('run');
    } else {
      $('tc').classList.add('show');
      $('tm').classList.add('show');
    }
  }
  loop();
  setInterval(loop, 550);
</script>
</body>
</html>
