<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #1c1917; --muted: #78716c; --accent: #b45309; --surface-2: #ede8df; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 640px; height: 155px; display: block; }
  .block { fill: var(--surface-2); rx: 12; }
  .line { fill: var(--muted); opacity: 0.3; rx: 4; transition: fill 0.25s, opacity 0.25s; }
  .line.run { fill: var(--accent); opacity: 0.95; }
  .cable { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 5 4; opacity: 0.45; }
  .pulse { fill: var(--accent); opacity: 0; }
  .tick-circle { fill: #16a34a; opacity: 0; transform-origin: 575px 77px; transform: scale(0.6); transition: opacity 0.3s, transform 0.3s; }
  .tick-circle.show { opacity: 1; transform: scale(1); }
  .tick-mark { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.3s; }
  .tick-mark.show { opacity: 1; }
</style>
</head>
<body>
<svg viewBox="0 0 640 155" aria-label="Animación de test de integración entre dos bloques de código">
  <!-- Bloque 1 -->
  <rect class="block" x="35" y="22" width="185" height="110" />
  <rect id="a0" class="line" x="55" y="44" width="90" height="10" />
  <rect id="a1" class="line" x="70" y="68" width="130" height="10" />
  <rect id="a2" class="line" x="55" y="92" width="105" height="10" />

  <!-- Cable de comunicación -->
  <line class="cable" x1="220" y1="77" x2="320" y2="77" />
  <circle id="sig" class="pulse" cx="220" cy="77" r="6" />

  <!-- Bloque 2 -->
  <rect class="block" x="320" y="22" width="185" height="110" />
  <rect id="b0" class="line" x="340" y="44" width="95" height="10" />
  <rect id="b1" class="line" x="355" y="68" width="130" height="10" />
  <rect id="b2" class="line" x="340" y="92" width="100" height="10" />

  <!-- Tick verde -->
  <circle id="tc" class="tick-circle" cx="575" cy="77" r="24" />
  <path id="tm" class="tick-mark" d="M 564 77 L 572 86 L 588 68" />
</svg>
<script>
  function syncTheme() {
    try {
      const p = parent && parent.document && parent.document.documentElement;
      if (!p) return;
      const cs = getComputedStyle(p);
      ['--text', '--muted', '--accent', '--surface-2'].forEach((v) => {
        const val = cs.getPropertyValue(v).trim();
        if (val) document.documentElement.style.setProperty(v, val);
      });
    } catch (_) {}
  }
  syncTheme();
  try {
    if (parent && parent.document && parent.document.documentElement) {
      new MutationObserver(syncTheme).observe(parent.document.documentElement, {
        attributes: true, attributeFilter: ['data-theme', 'class', 'style']
      });
    }
  } catch (_) {}

  const $ = (id) => document.getElementById(id);
  const sig = $('sig');
  let step = -1;

  function tick() {
    step = (step + 1) % 9;
    if (step === 0) {
      ['a0', 'a1', 'a2', 'b0', 'b1', 'b2'].forEach((id) => $(id).classList.remove('run'));
      $('tc').classList.remove('show');
      $('tm').classList.remove('show');
      sig.style.opacity = '0';
    } else if (step <= 3) {
      $('a' + (step - 1)).classList.add('run');
    } else if (step === 4) {
      sig.style.opacity = '1';
      const t0 = performance.now();
      function anim(now) {
        const p = Math.min(1, (now - t0) / 420);
        sig.setAttribute('cx', String(220 + p * 100));
        if (p < 1) requestAnimationFrame(anim);
        else sig.style.opacity = '0';
      }
      requestAnimationFrame(anim);
    } else if (step <= 7) {
      $('b' + (step - 5)).classList.add('run');
    } else {
      $('tc').classList.add('show');
      $('tm').classList.add('show');
    }
  }
  tick();
  setInterval(tick, 480);
</script>
</body>
</html>
