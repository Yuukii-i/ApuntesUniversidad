<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #1c1917; --muted: #78716c; --accent: #b45309; --surface-2: #ede8df; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 680px; height: 235px; display: block; }
  .box { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.6; rx: 12; transition: stroke 0.25s, stroke-width 0.25s; }
  .box.active { stroke: var(--accent); stroke-width: 2.6; }
  .box.done { stroke: #16a34a; stroke-width: 2.6; }
  .title { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; }
  .code { fill: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 600; text-anchor: middle; }
  .sub { fill: var(--muted); font-size: 11px; text-anchor: middle; }
  .cable { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-dasharray: 5 4; opacity: 0.45; }
  .pulse { fill: var(--accent); opacity: 0; }
</style>
</head>
<body>
<svg viewBox="0 0 680 235" aria-label="Animación del patrón Abstract Factory creando familias completas de componentes Windows o macOS">
  <path id="c-in" class="cable" d="M 190 118 L 250 118" />
  <path id="c-top" class="cable" d="M 430 96 C 460 96, 465 62, 495 62" />
  <path id="c-bot" class="cable" d="M 430 140 C 460 140, 465 174, 495 174" />

  <!-- Cliente genérico: Aplicacion -->
  <rect id="b-app" class="box" x="20" y="63" width="170" height="110" />
  <text class="title" x="105" y="88">Clase Aplicacion</text>
  <text class="sub" x="105" y="108">Código 100% genérico</text>
  <text class="code" x="105" y="132">fabrica.crearBoton()</text>
  <text class="code" x="105" y="152">fabrica.crearCasilla()</text>

  <!-- Fábrica inyectada: FabricaGUI -->
  <rect id="b-fab" class="box" x="250" y="63" width="180" height="110" />
  <text class="sub" x="340" y="86">FabricaGUI inyectada</text>
  <text id="t-fab" class="title" x="340" y="114">FabricaWindows</text>
  <text id="t-fam" class="code" x="340" y="144">Familia: Windows</text>

  <!-- Producto A: Boton -->
  <rect id="b-btn" class="box" x="495" y="22" width="165" height="80" />
  <text id="t-btn" class="title" x="577.5" y="52">BotonWindows</text>
  <text id="t-btn-s" class="code" x="577.5" y="78">Boton estilo Windows</text>

  <!-- Producto B: Casilla -->
  <rect id="b-chk" class="box" x="495" y="134" width="165" height="80" />
  <text id="t-chk" class="title" x="577.5" y="164">CasillaWindows</text>
  <text id="t-chk-s" class="code" x="577.5" y="190">Casilla estilo Windows</text>

  <circle id="sig-1" class="pulse" r="6" cx="190" cy="118" />
  <circle id="sig-2" class="pulse" r="6" cx="430" cy="140" />
</svg>
<script>
  function syncTheme() {
    try {
      const cs = getComputedStyle(parent.document.documentElement);
      ['--text', '--muted', '--accent', '--surface-2'].forEach(v => {
        const val = cs.getPropertyValue(v).trim();
        if (val) document.documentElement.style.setProperty(v, val);
      });
    } catch (_) {}
  }
  syncTheme();
  try {
    new MutationObserver(syncTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  } catch (_) {}

  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function movePulse(sigEl, pathEl, dur) {
    return new Promise(res => {
      const len = pathEl.getTotalLength(), s = performance.now();
      sigEl.style.opacity = '1';
      function step(now) {
        const p = Math.min(1, (now - s) / dur);
        const pt = pathEl.getPointAtLength(p * len);
        sigEl.setAttribute('cx', pt.x); sigEl.setAttribute('cy', pt.y);
        p < 1 ? requestAnimationFrame(step) : (sigEl.style.opacity = '0', res());
      }
      requestAnimationFrame(step);
    });
  }

  const families = [
    { fab: 'FabricaWindows', fam: 'Familia: Windows', btn: 'BotonWindows', btnS: 'Boton estilo Windows', chk: 'CasillaWindows', chkS: 'Casilla estilo Windows' },
    { fab: 'FabricaMac', fam: 'Familia: macOS', btn: 'BotonMac', btnS: 'Boton estilo macOS', chk: 'CasillaMac', chkS: 'Casilla estilo macOS' }
  ];
  let idx = 0;

  async function loop() {
    while (true) {
      const f = families[idx];
      ['b-app', 'b-fab', 'b-btn', 'b-chk'].forEach(id => $(id).classList.remove('active', 'done'));
      $('t-fab').textContent = f.fab;
      $('t-fam').textContent = f.fam;
      $('t-btn').textContent = f.btn;
      $('t-btn-s').textContent = '...';
      $('t-chk').textContent = f.chk;
      $('t-chk-s').textContent = '...';

      $('b-app').classList.add('active');
      await wait(450);

      await movePulse($('sig-1'), $('c-in'), 520);
      $('b-app').classList.remove('active');
      $('b-fab').classList.add('active');
      await wait(480);

      await Promise.all([
        movePulse($('sig-1'), $('c-top'), 520),
        movePulse($('sig-2'), $('c-bot'), 520)
      ]);
      $('b-fab').classList.remove('active');
      $('b-btn').classList.add('done');
      $('b-chk').classList.add('done');
      $('t-btn-s').textContent = f.btnS;
      $('t-chk-s').textContent = f.chkS;
      await wait(1550);
      idx = (idx + 1) % families.length;
    }
  }
  loop();
</script>
</body>
</html>
