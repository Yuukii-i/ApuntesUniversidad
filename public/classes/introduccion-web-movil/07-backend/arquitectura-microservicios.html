<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --text: #e6edf3; --muted: #8b949e; --accent: #38bdf8; --surface-2: #1f242c; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  svg { width: 100%; max-width: 720px; height: 240px; display: block; }
  .box { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.6; rx: 10; transition: stroke 0.25s, stroke-width 0.25s; }
  .box.active { stroke: var(--accent); stroke-width: 2.6; }
  .box.done { stroke: #22c55e; stroke-width: 2.6; }
  .db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.5; transition: stroke 0.25s, stroke-width 0.25s; }
  .db.active { stroke: #22c55e; stroke-width: 2.4; }
  .title { fill: var(--text); font-size: 12px; font-weight: 700; text-anchor: middle; }
  .sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
  .code { fill: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; text-anchor: middle; }
  .cable { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; opacity: 0.45; }
  .pulse { fill: var(--accent); opacity: 0; }
</style>
</head>
<body>
<svg viewBox="0 0 720 240" aria-label="Animación de arquitectura de microservicios con API Gateway al centro y separación de cargas">
  <!-- Cables -->
  <path id="c-in" class="cable" d="M 145 120 L 235 120" />
  <path id="c-1" class="cable" d="M 385 100 C 420 100, 430 44, 465 44" />
  <path id="c-2" class="cable" d="M 385 120 L 465 120" />
  <path id="c-3" class="cable" d="M 385 140 C 420 140, 430 196, 465 196" />
  <line class="cable" x1="615" y1="44" x2="645" y2="44" />
  <line class="cable" x1="615" y1="120" x2="645" y2="120" />
  <line class="cable" x1="615" y1="196" x2="645" y2="196" />

  <!-- Usuario / Cliente -->
  <rect id="b-user" class="box" x="15" y="78" width="130" height="84" />
  <text class="title" x="80" y="106">Usuario</text>
  <text class="sub" x="80" y="124">Envía petición</text>
  <text id="t-req" class="code" x="80" y="146">/catalogo</text>

  <!-- API Gateway (Al centro) -->
  <rect id="b-gw" class="box" x="235" y="72" width="150" height="96" />
  <text class="title" x="310" y="102">API Gateway</text>
  <text class="sub" x="310" y="122">(Recepcionista)</text>
  <text id="t-route" class="code" x="310" y="146">Redirigiendo...</text>

  <!-- Microservicio 1: Servidor Potente (Alta carga) -->
  <rect id="b-m1" class="box" x="465" y="12" width="150" height="64" />
  <text class="title" x="540" y="36">Servicio Catálogo</text>
  <text class="sub" x="540" y="56">Servidor Potente (Alta carga)</text>
  <path id="db1-b" class="db" d="M 645 28 L 645 62 A 28 7 0 0 0 701 62 L 701 28 Z" />
  <ellipse id="db1-t" class="db" cx="673" cy="28" rx="28" ry="7" />
  <text class="sub" x="673" y="50">DB 1</text>

  <!-- Microservicio 2: Servidor Estándar (Carga media) -->
  <rect id="b-m2" class="box" x="465" y="88" width="150" height="64" />
  <text class="title" x="540" y="112">Servicio Pagos</text>
  <text class="sub" x="540" y="132">Servidor Estándar (Media)</text>
  <path id="db2-b" class="db" d="M 645 104 L 645 138 A 28 7 0 0 0 701 138 L 701 104 Z" />
  <ellipse id="db2-t" class="db" cx="673" cy="104" rx="28" ry="7" />
  <text class="sub" x="673" y="126">DB 2</text>

  <!-- Microservicio 3: Servidor Ligero (Baja carga) -->
  <rect id="b-m3" class="box" x="465" y="164" width="150" height="64" />
  <text class="title" x="540" y="188">Servicio Reportes</text>
  <text class="sub" x="540" y="208">Servidor Ligero (Baja carga)</text>
  <path id="db3-b" class="db" d="M 645 180 L 645 214 A 28 7 0 0 0 701 214 L 701 180 Z" />
  <ellipse id="db3-t" class="db" cx="673" cy="180" rx="28" ry="7" />
  <text class="sub" x="673" y="202">DB 3</text>

  <circle id="sig" class="pulse" r="6" cx="145" cy="120" />
</svg>
<script>
  const v = n => { try { return getComputedStyle(parent.document.documentElement).getPropertyValue(n).trim(); } catch { return ""; } };
  function syncTheme() {
    ['--text', '--muted', '--accent', '--surface-2'].forEach(k => {
      const val = v(k);
      if (val) document.documentElement.style.setProperty(k, val);
    });
  }
  syncTheme();
  try {
    new MutationObserver(syncTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  } catch {}

  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function movePath(pathEl, rev, dur) {
    return new Promise(res => {
      const sig = $('sig'), len = pathEl.getTotalLength(), s = performance.now();
      sig.style.opacity = '1';
      function step(now) {
        const p = Math.min(1, (now - s) / dur);
        const pt = pathEl.getPointAtLength((rev ? 1 - p : p) * len);
        sig.setAttribute('cx', pt.x); sig.setAttribute('cy', pt.y);
        p < 1 ? requestAnimationFrame(step) : (sig.style.opacity = '0', res());
      }
      requestAnimationFrame(step);
    });
  }

  const routes = [
    { req: 'GET /catalogo', route: '→ Catálogo', cable: 'c-1', box: 'b-m1', dbb: 'db1-b', dbt: 'db1-t' },
    { req: 'POST /pagos', route: '→ Pagos', cable: 'c-2', box: 'b-m2', dbb: 'db2-b', dbt: 'db2-t' },
    { req: 'GET /reportes', route: '→ Reportes', cable: 'c-3', box: 'b-m3', dbb: 'db3-b', dbt: 'db3-t' }
  ];
  let idx = 0;

  async function loop() {
    while (true) {
      const r = routes[idx];
      ['b-user', 'b-gw', 'b-m1', 'b-m2', 'b-m3'].forEach(id => $(id).classList.remove('active', 'done'));
      ['db1-b', 'db1-t', 'db2-b', 'db2-t', 'db3-b', 'db3-t'].forEach(id => $(id).classList.remove('active'));
      $('t-req').textContent = r.req;
      $('t-route').textContent = 'Esperando...';

      $('b-user').classList.add('active');
      await wait(400);
      await movePath($('c-in'), false, 480);
      $('b-user').classList.remove('active');
      $('b-gw').classList.add('active');
      $('t-route').textContent = r.route;
      await wait(450);

      await movePath($(r.cable), false, 520);
      $('b-gw').classList.remove('active');
      $(r.box).classList.add('done');
      $(r.dbb).classList.add('active');
      $(r.dbt).classList.add('active');
      await wait(650);

      await movePath($(r.cable), true, 480);
      $(r.box).classList.remove('done');
      $(r.dbb).classList.remove('active');
      $(r.dbt).classList.remove('active');
      $('b-gw').classList.add('active');
      await movePath($('c-in'), true, 450);
      $('b-gw').classList.remove('active');
      $('b-user').classList.add('done');
      await wait(1100);
      idx = (idx + 1) % routes.length;
    }
  }
  loop();
</script>
</body>
</html>
